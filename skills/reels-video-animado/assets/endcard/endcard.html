<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Card final</title>
<!--
  Card final animado, 1080x1920, 4s.
  Determinístico: nada anima sozinho. Quem desenha o quadro é renderAt(t), com t em segundos.
  O render_endcard.py chama setup(perfil, fotoDataUrl) uma vez e depois renderAt(i/30) por quadro.
  Aberto direto no navegador, ele toca sozinho com dados de exemplo (pra conferir o desenho).
-->
<style>
@font-face { font-family: "PoppinsCard"; font-weight: 700; src: url("fonts/Poppins-Bold.ttf"); }
@font-face { font-family: "PoppinsCard"; font-weight: 800; src: url("fonts/Poppins-ExtraBold.ttf"); }
@font-face { font-family: "PoppinsCard"; font-weight: 900; src: url("fonts/Poppins-Black.ttf"); }
:root {
  --destaque: #FDD400;
  --papel: #F0EFE8;
  --ponto: #C9C7BE;
  --tinta: #111111;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--papel); }
body { font-family: "PoppinsCard", "Poppins", "Segoe UI", Arial, sans-serif; color: var(--tinta); }
#palco { position: absolute; inset: 0; overflow: hidden; background: var(--papel); }
#trama {
  position: absolute; inset: 0; opacity: .55;
  background-image: radial-gradient(circle, var(--ponto) 2px, transparent 2.4px);
  background-size: 14px 14px;
}
.abs { position: absolute; left: 0; right: 0; text-align: center; will-change: transform, opacity; }
#losangos .l {
  position: absolute; width: 34px; height: 34px; border-radius: 7px; background: var(--destaque);
}
#foto {
  left: 380px; right: auto; top: 540px; width: 320px; height: 320px; border-radius: 50%;
  border: 12px solid var(--destaque); background: #ddd center/cover no-repeat;
  box-shadow: 0 10px 30px rgba(0,0,0,.08);
}
#nome { top: 900px; font-size: 84px; font-weight: 800; letter-spacing: -1.5px; line-height: 110px; }
#handle-wrap { top: 1020px; }
#handle {
  display: inline-block; background: var(--tinta); color: var(--destaque);
  font-size: 54px; font-weight: 800; line-height: 100px; height: 100px; padding: 0 44px; border-radius: 50px;
}
#cta { top: 1128px; font-size: 68px; font-weight: 900; line-height: 84px; padding: 0 70px; text-transform: uppercase; }
#cta .p { display: inline-block; margin: 0 9px; }
#icones { top: 1420px; display: flex; justify-content: center; gap: 40px; }
#icones .i {
  width: 124px; height: 124px; border-radius: 50%; background: var(--tinta);
  display: flex; align-items: center; justify-content: center;
}
#icones svg { width: 62px; height: 62px; }
#wipe {
  position: absolute; left: 540px; top: 960px; width: 10px; height: 10px; margin: -5px 0 0 -5px;
  border-radius: 50%; background: var(--destaque);
}
</style>
</head>
<body>
<div id="palco">
  <div id="trama"></div>
  <div id="losangos"></div>
  <div id="foto" class="abs"></div>
  <div id="nome" class="abs"></div>
  <div id="handle-wrap" class="abs"><span id="handle"></span></div>
  <div id="cta" class="abs"></div>
  <div id="icones" class="abs"></div>
  <div id="wipe"></div>
</div>
<script>
// Ícones genéricos desenhados à mão (formas simples, cor do destaque).
const ICONES = {
  instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/></svg>',
  tiktok: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.5 3h3c.2 1.9 1.5 3.4 3.5 3.6v3c-1.3 0-2.5-.4-3.5-1v6.2a5.7 5.7 0 1 1-5.7-5.7c.3 0 .6 0 .9.1v3.1a2.6 2.6 0 1 0 1.8 2.5V3z"/></svg>',
  youtube: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 7.2a2.6 2.6 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4A2.6 2.6 0 0 0 2.4 7.2 27 27 0 0 0 2 12c0 1.6.1 3.2.4 4.8a2.6 2.6 0 0 0 1.8 1.8C5.8 19 12 19 12 19s6.2 0 7.8-.4a2.6 2.6 0 0 0 1.8-1.8c.3-1.6.4-3.2.4-4.8s-.1-3.2-.4-4.8z"/><path d="M10 15.2 15.2 12 10 8.8z" fill="#111"/></svg>',
  facebook: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.6 21v-7.7h2.6l.4-3h-3V8.4c0-.9.3-1.5 1.5-1.5h1.6V4.2c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.2H7.9v3h2.6V21h3.1z"/></svg>'
};
const ORDEM_REDES = ["instagram", "tiktok", "youtube", "facebook"];

// Easings
const clamp = (x) => Math.max(0, Math.min(1, x));
const prog = (t, a, d) => clamp((t - a) / d);
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeInOut = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const backOut = (x) => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

let palavras = [], icones = [], losangos = [];

// Losangos: posições fixas (sem aleatório, render sempre igual).
const L = [[150,420,1],[930,300,.8],[880,1040,1.1],[120,1250,.7],[960,1650,.9],[210,1760,1.2],[760,560,.6],[300,880,.8]];

function setup(perfil, foto) {
  perfil = perfil || {};
  document.documentElement.style.setProperty("--destaque", perfil.cor_destaque || "#FDD400");
  document.getElementById("nome").textContent = perfil.nome || "Seu Nome";
  const redes = perfil.redes || {};
  const qual = perfil.handle_no_card || "instagram";
  document.getElementById("handle").textContent = redes[qual] || "@seu.perfil";
  const cta = document.getElementById("cta");
  cta.innerHTML = "";
  palavras = (perfil.cta_final || "SEGUE AÍ PARA MAIS DICAS DE IA").split(/\s+/).map((w) => {
    const s = document.createElement("span"); s.className = "p"; s.textContent = w; cta.appendChild(s); return s;
  });
  const box = document.getElementById("icones");
  box.innerHTML = "";
  const lista = ORDEM_REDES.filter((r) => redes[r]);
  icones = (lista.length ? lista : ORDEM_REDES).map((r) => {
    const d = document.createElement("div"); d.className = "i"; d.style.color = "var(--destaque)";
    d.innerHTML = ICONES[r]; box.appendChild(d); return d;
  });
  const f = document.getElementById("foto");
  if (foto) f.style.backgroundImage = `url("${foto}")`;
  const ls = document.getElementById("losangos");
  ls.innerHTML = "";
  losangos = L.map(([x, y, s]) => {
    const d = document.createElement("div"); d.className = "l"; ls.appendChild(d); return { d, x, y, s };
  });
  return { icones: icones.length, palavras: palavras.length };
}

// Linha do tempo (segundos). Os "pins" do áudio caem em ICONE_T.
const ICONE_T = [2.0, 2.18, 2.36, 2.54];

function renderAt(t) {
  // Wipe: círculo amarelo cresce do centro, cobre a tela e abre revelando o card.
  const w = document.getElementById("wipe");
  const cresce = easeInOut(prog(t, 0, .38));
  const some = prog(t, .38, .3);
  w.style.transform = `scale(${cresce * 460})`;
  w.style.opacity = String(1 - easeOut(some));

  // Losangos: entram com pop e flutuam devagar.
  losangos.forEach(({ d, x, y, s }, i) => {
    const e = backOut(prog(t, .35 + i * .05, .4));
    const fy = Math.sin(t * 1.6 + i * 1.3) * 14, rot = 45 + Math.sin(t * .9 + i) * 18;
    d.style.left = x + "px"; d.style.top = y + fy + "px";
    d.style.transform = `rotate(${rot}deg) scale(${e * s})`;
    d.style.opacity = String(clamp(e) * .95);
  });

  // Foto com pop.
  const fp = prog(t, .55, .45);
  const foto = document.getElementById("foto");
  foto.style.transform = `scale(${backOut(fp)})`;
  foto.style.opacity = String(clamp(fp * 3));

  // Nome sobe.
  const np = easeOut(prog(t, .8, .4));
  const nome = document.getElementById("nome");
  nome.style.transform = `translateY(${(1 - np) * 40}px)`; nome.style.opacity = String(np);

  // @ com pop.
  const hp = prog(t, 1.05, .35);
  const hw = document.getElementById("handle-wrap");
  hw.style.transform = `scale(${hp ? backOut(hp) : 0})`; hw.style.opacity = String(clamp(hp * 3));

  // Palavras do CTA em sequência.
  const passo = Math.min(.12, .6 / Math.max(1, palavras.length));
  palavras.forEach((p, i) => {
    const e = prog(t, 1.3 + i * passo, .25);
    p.style.transform = `translateY(${(1 - easeOut(e)) * 30}px) scale(${.9 + .1 * backOut(e)})`;
    p.style.opacity = String(easeOut(e));
  });

  // Ícones sobem um a um e depois pulsam.
  icones.forEach((ic, i) => {
    const a = ICONE_T[Math.min(i, ICONE_T.length - 1)];
    const e = prog(t, a, .3);
    const pulso = t > 2.9 ? 1 + .06 * Math.max(0, Math.sin((t - 2.9) * 5 - i * .7)) : 1;
    ic.style.transform = `translateY(${(1 - backOut(e)) * 60}px) scale(${(e ? 1 : 0) * pulso})`;
    ic.style.opacity = String(clamp(e * 2));
  });
}

window.setup = setup;
window.renderAt = renderAt;

// Pré-visualização: aberto direto no navegador, toca em loop com dados de exemplo.
if (!window.__RENDER__) {
  setup({ nome: "Seu Nome", redes: { instagram: "@seu.perfil", tiktok: "@seu.perfil", youtube: "@canal", facebook: "Seu Nome" } });
  const t0 = performance.now();
  (function loop() { renderAt(((performance.now() - t0) / 1000) % 4.5); requestAnimationFrame(loop); })();
}
</script>
</body>
</html>
